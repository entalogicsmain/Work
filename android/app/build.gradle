apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// The number of commits: it only ever goes up, and it is the same on this machine and on GitHub, so a newer build
// always installs over an older one (CI checks out the full history for this).
def appVersionCode = {
    int n = 0
    try { n = 'git rev-list --count HEAD'.execute(null, rootDir).text.trim() as int } catch (ignored) { }
    return n > 0 ? n : 1 + ((System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int)
}()

android {
    namespace = "com.entalogics.comeback"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.entalogics.comeback"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Fixed debug key (not a secret) so APKs built here and on GitHub share one signature
        // and can be installed over each other without uninstalling (which would wipe app data).
        debug {
            storeFile file('comeback-debug.keystore')
            storePassword 'android'
            keyAlias 'comebackdebug'
            keyPassword 'android'
        }        // The release APK is signed with the SAME key by default, so it installs over the earlier builds and keeps your data
        // (Android refuses an update that is signed with a different key). To use your own private key instead, set
        // COMEBACK_KEYSTORE (path), COMEBACK_KEYSTORE_PASSWORD, COMEBACK_KEY_ALIAS and COMEBACK_KEY_PASSWORD.
        release {
            def ks = System.getenv('COMEBACK_KEYSTORE')
            storeFile ks ? file(ks) : file('comeback-debug.keystore')
            storePassword ks ? System.getenv('COMEBACK_KEYSTORE_PASSWORD') : 'android'
            keyAlias ks ? System.getenv('COMEBACK_KEY_ALIAS') : 'comebackdebug'
            keyPassword ks ? System.getenv('COMEBACK_KEY_PASSWORD') : 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    testOptions { unitTests.returnDefaultValues = true }
    lint {
        // No instrumented tests exist; skipping test sources keeps lint from resolving their libraries.
        ignoreTestSources = true
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = false
    }
    buildTypes {
        release {
            // Not shrunk or obfuscated: Capacitor loads its plugins by name, and there is no phone here to test the keep rules on.
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    // app lock (Settings > Security): BiometricPrompt with a screen-lock fallback
    implementation 'androidx.biometric:biometric:1.1.0'
    // step tracking
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
