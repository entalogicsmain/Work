name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships the Android SDK; just accept licenses and make sure platform 36 is there.
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Bundle plugins and sync web app into Android project
        run: npm run sync

      # The web tests drive the real www/ app in headless Chromium (the Supabase server is an in-memory fake).
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD above only keeps `npm ci` light; the browser is installed explicitly here.
      - name: Install Chromium for the web tests
        run: env -u PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD npx playwright install --with-deps chromium

      - name: Web tests (logic, structure, UI, sync, data safety, rename, steps, permissions, refresh, contrast, responsive)
        run: npm test

      - name: Step-counting unit tests (simulated sensors)
        working-directory: android
        run: |
          n=0
          until ./gradlew :app:testDebugUnitTest --no-daemon -Dorg.gradle.internal.repository.max.retries=12 -Dorg.gradle.internal.repository.initial.backoff=4000; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "Gradle failed (often Maven Central rate limiting); retrying in 30 s"; sleep 30
          done

      - name: Android lint
        working-directory: android
        run: |
          n=0
          until ./gradlew :app:lintDebug --no-daemon -Dorg.gradle.internal.repository.max.retries=12 -Dorg.gradle.internal.repository.initial.backoff=4000; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "Gradle failed (often Maven Central rate limiting); retrying in 30 s"; sleep 30
          done

      - name: Build debug APK
        working-directory: android
        run: |
          n=0
          until ./gradlew assembleDebug --no-daemon -Dorg.gradle.internal.repository.max.retries=12 -Dorg.gradle.internal.repository.initial.backoff=4000; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "Gradle failed (often Maven Central rate limiting); retrying in 30 s"; sleep 30
          done

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Comeback-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Comeback-debug-apk
          path: out/Comeback-debug.apk
          if-no-files-found: error
